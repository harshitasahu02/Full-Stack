<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic forms</title>
</head>
<body>
    <fieldset>
        <legend align="center">Basic Form</legend> 
        <form >
        <label for="fullName">Full name :</label>
        <input type="text" name="yourName" id="fullName"
        placeholder=" Enter Your Name"/>
        <br/>
        <br/>

        <label for="email">Email : </label>
        <input type="text" name="email" id="email" placeholder="Your Email"/>
        <br/>
        <br/>

        <label for="password">password:</label>
        <input type="text"
         name="password"
          id="password"
          placeholder="Your Password"
          />
        <br/>
        <br/>

        <label for="cfPassword">Confirm pasword:</label>
        <input type="text"
         name="cfpassword"
          id="cfpassword"
          placeholder="Confirm your password"
          />
         <br/>
        <br/>

        <label for="dob">Date Of Birth:</label>
        <input type="date"
         name="dob"
          id="dob"
          />
        <br/>
        <br/>

        <label for="tob">Time:</label>
        <input type="time"
         name="tob"
          id="tob"
          />
         <br/>
        <br/>

        <label for="joining time"> Joining Time:</label>
        <input type="datetime-local"
         name="joiningTime"
          id="joiningTime"
          />
        <br/>
        <br/>

        <label for="volume"> Volume:</label>
        <input type="range"
         name="volume"
         id="volume"
         min="0"
         max="10"
         value="7"
          />
          <br/>
          <br/>

         <label for="mobile"> Mobile Number:</label>
        <input type="number"
         name="mobile"
          id="mobile"
        />
        <br/>
        <br/>

         <label for=""> resume:</label>
        <input type="file"
         name="resume"
          id="resume"
        />
        <br/>
        <br/>

        <label for="address"> Address:</label>
        <textarea name="address" id="address"></textarea>


        
        <br/>
        <br/>
         <label for="course"> Course:</label>
         <select name="course" id="course">
         <option value=""> -----select course----</option>
         <option value="btech"> B.tech</option>
         <option value="bba">BBA</option>
         <option value="mtech">M.tech</option>
         <option value="mba">MBA</option>

         </select>

           <br/>
           <br/>
           <label for="gender">Gender:</label>
           <input type="radio" name="gender" id="male"  value="male" />
           <span>Male</span>
           <input type="radio" name="gender" id="female"  value="female" />
           <span>Female</span>
           <input type="radio" name="gender" id="other"  value="other" />
           <span>Others</span>

           <br/>
           <br/>

           <label for="skillset">Skillset:</label>
           <input type="checkbox" name="skillset" id="java"  value="java" />
           <span>JAVA</span>
           <input type="checkbox" name="skillset" id="dsa"  value="dsa" />
           <span>DSA</span>
           <input type="checkbox" name="skillset" id="html"  value="html" />
           <span>HTML</span>

          <br/>
          <br/>
          <img src="./" alt="" 
          width="200px" height="100px">
          
           <br/>
           <br/>



          <button> submit</button>


    </form>
</fieldset>
   
</body>
</html>
